name: ChileDeals Price Radar

on:
  schedule:
    # Ejecuta cada 5 minutos (modo Black Friday alta velocidad en GitHub Actions)
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Run ChileDeals Radar scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m src.main --mode scan

      - name: Commit updated price history and web feed
        run: |
          git config user.name "chiledeals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.db docs/data/deals.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(radar): update price history and active deals [skip ci]"
            git push
          else
            echo "No changes in database or web feed."
          fi
